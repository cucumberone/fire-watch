# alert-fold.lua — the ordering + dedup guard for alert state.
#
# Specified in docs/event-lifecycle.md §5.2 and §5.4. Loaded by the worker and
# invoked with EVAL/EVALSHA, so the compare-and-set is atomic across the three
# workers racing on the same alert key.
#
# KEYS[1] = fw:alert:{key}
# KEYS[2] = fw:alert:open:{key}
# KEYS[3] = fw:idx:alert:open   (zset: alert key -> last activity ms)
# KEYS[4] = fw:idx:alert:closed (zset: alert key -> closed_at ms)
#
# KEYS[3] is what makes the board survive a page reload. Without it there is no
# way to enumerate open alerts except SCAN fw:alert:open:*, which is an
# unbounded scan and was rejected by design (websocket-server.md §3). It lives
# inside this script so the index can never drift from the state it indexes:
# both the close path and the open path are already atomic here, and a crash
# between an HSET and a separate ZADD would otherwise leave a phantom row on
# every operator's screen forever.
#
# KEYS[4] is the same idea for RETIRED alerts, so the Closed tab can list the last
# 7 days without scanning. Membership is removed when an alert re-opens: an alert
# that is firing again is not closed, and leaving it in both indexes would show
# the same key in two tabs.
#
# ARGV[1] = broker_ts_ms
# ARGV[2] = event id
# ARGV[3] = severity
# ARGV[4] = dedup window in ms  (UNUSED since the coalescing window was removed;
#           kept in the signature so an older worker calling with 4 args still
#           works during a rolling update)
# ARGV[5] = alert key (source:type), used as the index member
#
# Returns: 0 stale/duplicate | 1 applied | 3 closed
#
# There is no longer a separate "coalesced" return code. A DUPLICATE IS DROPPED
# (returns 0) by the (timestamp, id) watermark below, so it never reaches the
# counter; every event that does get through is counted, and moves last_seen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-fold
  labels:
    app.kubernetes.io/name: worker
data:
  alert-fold.lua: |
    -- Degrade gracefully if the open index is missing.
    --
    -- The worker and this ConfigMap are separate objects and do not roll out in
    -- lockstep: a worker pod running newer code can invoke an older script (the
    -- ConfigMap volume lags) or a cached script can outlive a revert. Reading
    -- KEYS[3] unconditionally would turn every event into a runtime error in
    -- exactly that window, and the worker would requeue forever.
    --
    -- So the index is maintained only when the caller supplied it. The index can
    -- therefore be temporarily incomplete during a rolling update, which is a
    -- far better failure than "no events are accepted at all".
    local has_index = (KEYS[3] ~= nil) and (ARGV[5] ~= nil)

    local wm_ts  = tonumber(redis.call('HGET', KEYS[1], 'watermark') or '0')
    local wm_id  = redis.call('HGET', KEYS[1], 'watermark_id') or ''
    local ts     = tonumber(ARGV[1])
    local id     = ARGV[2]
    local sev    = ARGV[3]
    local window = tonumber(ARGV[4])

    -- 1. ordering guard: (timestamp, id) lexicographic.
    --    Stops a redelivered old CLOSE from retiring a newer CRITICAL.
    if ts < wm_ts or (ts == wm_ts and id <= wm_id) then
      return 0
    end

    local is_open = redis.call('EXISTS', KEYS[2])

    -- 2. retirement events end the episode.
    --
    --    An acknowledgement belongs to ONE episode. Clearing it here is what
    --    stops a re-fire from looking already-handled: without the HDEL, an
    --    operator would ack a resolved alert, the condition would return, and
    --    the row would come back still marked "acked by alice" with nobody
    --    looking at it. That is the single most dangerous failure mode of an
    --    ack feature (docs/acknowledge.md §6).
    if sev == 'CLOSE' or sev == 'HARMLESS' then
      redis.call('DEL', KEYS[2])
      -- Retirement must also drop the key from the open index, or the board
      -- would hand a stale row to every client that connects afterwards.
      if has_index then
        redis.call('ZREM', KEYS[3], ARGV[5])
        -- ...and record WHEN it closed, which is what the Closed tab sorts and
        -- filters on. Kept in the same script so the two indexes cannot
        -- disagree: a key is in exactly one of them.
        if KEYS[4] ~= nil then
          redis.call('ZADD', KEYS[4], ts, ARGV[5])
        end
      end
      redis.call('HSET', KEYS[1],
        'state', 'closed',
        'severity', sev,
        'closed_by', id,
        'closed_at', ts,
        'watermark', ts,
        'watermark_id', id)
      redis.call('HDEL', KEYS[1], 'acked_by', 'acked_at')
      redis.call('PEXPIRE', KEYS[1], 604800000)
      return 3
    end

    -- 3. count it.
    --
    -- Every event that reaches here is a DISTINCT event: the watermark above
    -- already dropped any exact repeat (same id, same or older timestamp). So
    -- there is nothing to suppress and nothing to coalesce — one event, one
    -- count, and last_seen always moves.
    --
    -- An earlier design coalesced repeats arriving within
    -- FW_ALERT_DEDUP_WINDOW, which left every row reading "Count 1" during a
    -- duplicate storm. That was removed: it is indistinguishable from a broken
    -- counter, and the dedup it was imitating is already done by the watermark.
    local last  = tonumber(redis.call('HGET', KEYS[1], 'last_seen') or '0')
    local count = tonumber(redis.call('HGET', KEYS[1], 'count') or '0')
    local first = redis.call('HGET', KEYS[1], 'first_seen') or tostring(ts)
    local episode_started = (is_open == 0 or last == 0)

    if episode_started then
      count, first = 1, ts                           -- first event of an episode
    else
      count = count + 1                              -- every event counts
    end

    redis.call('SET', KEYS[2], '1', 'EX', 604800)
    -- Re-opening removes it from the closed index. An alert that is firing is
    -- not closed, and leaving it listed in both tabs would be a contradiction
    -- the operator has to resolve by hand.
    if has_index and KEYS[4] ~= nil then
      redis.call('ZREM', KEYS[4], ARGV[5])
    end
    -- Keep the open index in step. The score is the last activity, so a bounded
    -- ZREVRANGE always returns the most recently active alerts first.
    if has_index then
      redis.call('ZADD', KEYS[3], ts, ARGV[5])
    end
    redis.call('HSET', KEYS[1],
      'state', 'open',
      'severity', sev,
      'last_id', id,
      'first_seen', first,
      'last_seen', ts,
      'count', count,
      'watermark', ts,
      'watermark_id', id)

    -- An acknowledgement belongs to one EPISODE, not one event. It is cleared
    -- when the alert was not already open (a re-fire after retirement) and left
    -- alone while the alert stays open — otherwise every duplicate would
    -- silently un-acknowledge the row an operator had already claimed
    -- (docs/acknowledge.md §6).
    if episode_started then
      redis.call('HDEL', KEYS[1], 'acked_by', 'acked_at')
    end

    redis.call('PEXPIRE', KEYS[1], 604800000)
    return 1
