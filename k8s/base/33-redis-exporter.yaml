# redis-exporter — required because Sentinel has no HTTP endpoint.
#
# Sentinel speaks RESP on 26379 only. Prometheus cannot scrape RESP, so an
# exporter translates it to /metrics. The Sentinel ServiceMonitor in
# 60-monitoring.yaml depends on this.
#
# One exporter instance scrapes all three sentinels via its `check` list, which
# is why there is a Deployment (1 replica) rather than a sidecar: the data is
# identical from every sentinel, and a duplicate scrape would double-count
# quorum rules.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: docker.io/oliver006/redis_exporter:v1.66.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: metrics, containerPort: 9121 }
          env:
            # Sentinel mode: point at the sentinels, not at Dragonfly, and name
            # the monitored master so `master_name` appears as a label.
            - name: REDIS_ADDR
              value: "redis://sentinel-0.sentinel-headless:26379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: fire-watch-dragonfly, key: password }
            # The exporter treats this instance as a Sentinel, which enables the
            # redis_sentinel_* metric family.
            - { name: REDIS_EXPORTER_IS_SENTINEL, value: "true" }
            # Scrape all three so a single down sentinel is visible rather than
            # silently reducing quorum.
            - name: REDIS_EXPORTER_CHECK_SINGLE_KEYS
              value: ""
            - name: REDIS_EXPORTER_LOG_FORMAT
              value: "json"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
