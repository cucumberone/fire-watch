# Valkey configuration + the AOF rotation guard.
#
# Specified in docs/valkey.md §4. Valkey implements AOF, so the AGENTS.md
# requirement ("use the AOF feature, refresh that file with a new one from what's
# left") is satisfiable as written: `appendonly yes` + `appendfsync everysec`
# gives a <=1 s RPO, and the log is ROTATED when it reaches 32 MB rather than on a
# clock.
#
# WHY SIZE AND NOT TIME. A timer rewrites on the clock, so a busy hour leaves a
# large AOF sitting there until the boundary and a quiet hour rewrites for nothing.
# The requirement is a size threshold, so the trigger is the size:
#
#   auto-aof-rewrite-percentage 0     rotate on size alone (see the note in the
#                                     config below for why 100 would not do)
#   auto-aof-rewrite-min-size 32mb    the threshold itself
#
# The rewrite produces a fresh RDB-preamble image, so "take a 32 MB snapshot" and
# "roll the AOF log" are one operation — there is nothing separate to schedule.
#
# Two settings are correctness requirements, not tuning:
#   --requirepass / --masterauth  -> Sentinel auth-pass and every client
#                                    authenticate; replicas authenticate upward
#                                    (fault-tolerance.md §3.6)
#   maxmemory-policy noeviction   -> any other policy silently deletes live
#                                    events at maxmemory, breaking 7-day
#                                    retention with no signal (fault-tolerance.md §3.9)
#
# Split-brain protection is enforced by the ENGINE here, not only by routing:
# `min-replicas-to-write 2` makes the master refuse writes when it cannot see two
# replicas. That is the AGENTS.md "always find 2 replicas before accepting
# writes" rule. The lab overlay sets it to 0 (one pod, no replica).
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
  labels:
    app.kubernetes.io/name: valkey
data:
  valkey.conf: |
    # ---- network ------------------------------------------------------------
    bind 0.0.0.0
    port 6379
    protected-mode no
    tcp-keepalive 60
    timeout 0

    # ---- persistence --------------------------------------------------------
    # AOF is the durability mechanism. everysec is the only sane choice: `always`
    # costs a sync per write (16.7/s sustained is fine, 500/s is not), `no` gives
    # the OS up to 30 s to lose the tail.
    dir /data
    appendonly yes
    appendfsync everysec
    appenddirname appendonlydir
    # RDB preamble: the AOF base is a compact RDB image instead of a long history
    # of individual commands, which is what keeps an AOF-only restart fast.
    aof-use-rdb-preamble yes
    # ---- the rotation rule --------------------------------------------------
    # "Take a 32MB snapshot and roll the AOF log."
    #
    # `auto-aof-rewrite-min-size 32mb` states the threshold. What actually
    # enforces it is the `aof-rewriter` sidecar, and the two conf settings below
    # exist because the ENGINE CANNOT EXPRESS THE RULE. Measured on Valkey 8.1.11
    # (the exact sequence is in docs/valkey.md §4.2):
    #
    #   percentage 0   -> auto-rewrite is DISABLED, not "trigger on size". Proven:
    #                     with min-size 1 the AOF was allowed to exceed the base
    #                     indefinitely (aof_rewrites stayed put). This is the
    #                     common misreading, and the reason the number below is 0.
    #   percentage 1   -> rewrites again, but the trigger is
    #                     `current >= base * (1 + pct/100)`, i.e. RELATIVE to the
    #                     base. The base is an RDB preamble of the WHOLE dataset,
    #                     so at the production working set (~33 GiB,
    #                     [sizing.md](sizing.md) §3.5) any integer percentage means
    #                     "grow by hundreds of MB to GiBs" — never 32 MB.
    #
    # There is no engine setting for "after 32 MB of GROWTH", so rotation is owned
    # by the sidecar, which measures `aof_current_size - aof_base_size` and forces
    # a rewrite at 32 MB. `percentage 0` turns the engine's own trigger off so the
    # two cannot fight; `min-size` stays as the single place the number is written
    # down (and as the correct floor if percentage is ever re-enabled).
    #
    # MEASURING GROWTH, NOT ABSOLUTE SIZE, IS LOAD-BEARING. `aof_current_size`
    # already includes the base, so a naive `current > 32mb` check is true
    # permanently once the dataset exceeds 32 MB — an endless rewrite loop, each
    # one forking a full copy of the dataset.
    auto-aof-rewrite-percentage 0
    auto-aof-rewrite-min-size 32mb
    aof-load-truncated yes
    aof-timestamp-enabled yes

    # RDB snapshots are DISABLED. With AOF+RDB-preamble there is nothing they add,
    # and each background save forks a ~29 GiB process — a memory spike for no
    # durability gain.
    save ""

    # ---- memory -------------------------------------------------------------
    # maxmemory sits ABOVE the 7-day working set on purpose. The usual "leave 20%
    # free for eviction" advice is inverted here: eviction would delete live
    # events, so writes must fail loudly instead (worker requeues, backlog
    # becomes visible). Derivation in docs/sizing.md §3.4.
    maxmemory 40gb
    maxmemory-policy noeviction

    # ---- replication / split brain ------------------------------------------
    # Refuse writes unless 2 replicas are connected and have acknowledged within
    # 10 s. This is the engine-level half; sentinel-bridge additionally empties
    # the Service endpoint so clients cannot reach a minority master at all.
    min-replicas-to-write 2
    min-replicas-max-lag 10
    replica-read-only yes
    # Replicas must not expire keys on their own read path: the master drives
    # expiry, and a replica deleting independently diverges from it.
    replica-ignore-maxmemory yes
    replica-serve-stale-data no
    repl-backlog-size 256mb
    repl-diskless-sync yes
    repl-diskless-sync-delay 2

    # ---- keyspace notifications --------------------------------------------
    # Not used by the application (clients use PUBLISH on our own channels), but
    # left off explicitly so nobody mistakes this for an integration point.
    notify-keyspace-events ""

  # Reads the flag file, appends the credentials from the environment, and execs
  # the server. A script rather than bare args because the password must never be
  # inlined in a manifest (`args` is visible to anyone who can read the pod spec).
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    : "${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}"
    exec valkey-server /etc/valkey/valkey.conf \
      --requirepass "$VALKEY_PASSWORD" \
      --masterauth  "$VALKEY_PASSWORD"

  # AOF rotation: rewrite once the log has GROWN 32 MB since the last snapshot.
  #
  # THIS SCRIPT OWNS THE RULE, and that is not a preference — the engine cannot
  # express it. Verified on Valkey 8.1.11 against the running pod:
  #
  #   auto-aof-rewrite-percentage 0   DISABLES automatic rewriting. It does not
  #                                   mean "trigger on size alone". With min-size
  #                                   set to 1 byte and the AOF already larger
  #                                   than its base, `aof_rewrites` did not move.
  #   auto-aof-rewrite-percentage 1   rewriting resumes, but relative to the base
  #                                   (`current >= base * 1.01`), and the base is
  #                                   the whole dataset — so the effective
  #                                   threshold is unbounded in practice.
  #
  # Hence `percentage 0` in the config (engine trigger OFF, so it cannot fight
  # this) and the measurement below.
  #
  # WHAT IS MEASURED: `aof_current_size - aof_base_size`, the bytes appended since
  # the last rewrite/snapshot. NOT absolute size: `aof_current_size` includes the
  # base, so an absolute `> 32mb` test is permanently true as soon as the dataset
  # passes 32 MB and would rewrite in an endless loop, forking a full copy of the
  # dataset each time.
  #
  # 32 MB of growth is small next to a ~33 GiB dataset, so on production this
  # rotates often — which is the point: an AOF that is replayed at boot is at most
  # one snapshot plus <= 32 MB of commands.
  rewrite.sh: |
    #!/bin/sh
    set -eu
    : "${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}"
    # How often to measure. The TRIGGER is the byte count below.
    INTERVAL="${FW_AOF_CHECK_INTERVAL:-60}"
    # 32 MB decimal. POSIX sh has no `32m` literal; 32 * 1024 * 1024 = 33554432.
    THRESHOLD="${FW_AOF_REWRITE_BYTES:-33554432}"

    while true; do
      touch /tmp/alive
      # --no-raw so the reply is a status string we can grep. valkey-cli exits 0
      # even when AUTH fails, so every assertion has to be on the OUTPUT — the
      # same defect that made the old probes meaningless (docs/valkey.md §5.1).
      info=$(valkey-cli -p 6379 --no-auth-warning -a "$VALKEY_PASSWORD" --raw info persistence 2>&1 || true)

      num() { printf '%s\n' "$info" | sed -n "s/^$1:\([0-9-]*\).*/\1/p"; }
      cur=$(num aof_current_size)
      base=$(num aof_base_size)
      inprog=$(num aof_rewrite_in_progress)

      if [ -z "${cur:-}" ] || [ -z "${base:-}" ]; then
        echo "could not read AOF sizes; info output: $(printf '%s' "$info" | head -c 200)" >&2
        sleep "$INTERVAL"
        continue
      fi

      growth=$((cur - base))
      # A base above the current size means a rewrite just switched files;
      # treat it as zero growth rather than letting a negative value pass.
      [ "$growth" -lt 0 ] && growth=0

      if [ "${inprog:-0}" = "0" ] && [ "$growth" -ge "$THRESHOLD" ]; then
        echo "AOF grew ${growth} bytes since the base (${cur} total), threshold ${THRESHOLD}; rewriting" >&2
        out=$(valkey-cli -p 6379 --no-auth-warning -a "$VALKEY_PASSWORD" BGREWRITEAOF 2>&1 || true)
        case "$out" in
          *"rewriting started"*) ;;
          *"already"*|*"in progress"*) ;;
          *) echo "BGREWRITEAOF not accepted: $out" >&2 ;;
        esac
      else
        # Printed every pass on purpose: "the AOF never rotated" is otherwise only
        # discovered as a slow restart months later.
        echo "aof growth ${growth} bytes (base ${base}, current ${cur}), threshold ${THRESHOLD}"
      fi

      sleep "$INTERVAL"
    done
