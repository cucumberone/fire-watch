name: sentinel-bridge image

# Builds and pushes ONLY the sentinel-bridge image.
#
#   ghcr.io/cucumberone/fire-watch/sentinel-bridge:<tag>
#
# Path-filtered, so an unrelated change does not rebuild it. See worker.yaml for
# the full rationale on path filters, tags and the absence of
# `pull_request_target`.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'services/sentinel-bridge/**'
      - '.github/workflows/sentinel-bridge.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'services/sentinel-bridge/**'
      - '.github/workflows/sentinel-bridge.yaml'
  workflow_dispatch:

concurrency:
  group: image-sentinel-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/cucumberone/fire-watch/sentinel-bridge

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/sentinel-bridge/package-lock.json

      - name: Install
        working-directory: services/sentinel-bridge
        run: npm ci --no-audit --no-fund

      # The planner tests are the ones that matter here: a wrong REPLICAOF or a
      # missing epoch comparison breaks failover in a way nothing else catches.
      - name: Test
        working-directory: services/sentinel-bridge
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=fire-watch sentinel-bridge
            org.opencontainers.image.description=fire-watch event server — Sentinel to Dragonfly reconciler
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/sentinel-bridge
          file: services/sentinel-bridge/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=sentinel-bridge
          cache-to: type=gha,scope=sentinel-bridge,mode=max
          provenance: true
          sbom: true
          pull: true
