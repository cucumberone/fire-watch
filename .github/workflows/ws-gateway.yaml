name: ws-gateway image

# Builds and pushes ONLY the ws-gateway image.
#
#   ghcr.io/cucumberone/fire-watch/ws-gateway:<tag>
#
# Path-filtered, so an unrelated change does not rebuild it. See worker.yaml for
# the full rationale on path filters, tags and the absence of
# `pull_request_target`.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'services/ws-gateway/**'
      - '.github/workflows/ws-gateway.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'services/ws-gateway/**'
      - '.github/workflows/ws-gateway.yaml'
  workflow_dispatch:

# Scoped per service: a shared group would let one service's build cancel
# another's when both are pushed in the same commit.
concurrency:
  group: image-ws-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/cucumberone/fire-watch/ws-gateway

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ws-gateway/package-lock.json

      - name: Install
        working-directory: services/ws-gateway
        run: npm ci --no-audit --no-fund

      # The gateway now owns the one Dragonfly write (the ack path), so its unit
      # tests are load-bearing, not decorative.
      - name: Test
        working-directory: services/ws-gateway
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=fire-watch ws-gateway
            org.opencontainers.image.description=fire-watch event server — WebSocket gateway
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/ws-gateway
          file: services/ws-gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=ws-gateway
          cache-to: type=gha,scope=ws-gateway,mode=max
          provenance: true
          sbom: true
          pull: true
