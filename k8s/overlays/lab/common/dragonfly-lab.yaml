# Dragonfly for the lab.
#
# The flags live in a ConfigMap (dragonfly-config), so this patches the *file*
# rather than an args list. That avoids the Kustomize trap where an args patch
# silently drops a flag such as --maxmemory-policy=noeviction
# (docs/kustomize.md §3.4).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dragonfly-config
data:
  dragonfly.flags: |
    --logtostderr
    --dir=/data
    --dbfilename=firewatch-{timestamp}
    --df_snapshot_format=true
    --snapshot_cron=*/15 * * * *
    --maxmemory=512mb
    --proactor_threads=1
    --replica_delete_expired=false
    --port=6379
    --admin_port=9222
