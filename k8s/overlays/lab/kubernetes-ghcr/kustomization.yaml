# Plain-Kubernetes lab flavour with GHCR images.
#
#   kubectl apply -k k8s/overlays/lab/kubernetes-ghcr
#
# This is `lab/kubernetes` (no Routes, NodePort) PLUS the GHCR image rewrite
# from `overlays/ghcr`. It exists because `lab/kubernetes` still points at the
# OpenShift internal registry, which a MicroK8s/kind/k3s node cannot resolve:
#
#   dial tcp: lookup image-registry.openshift-image-registry.svc on 127.0.0.53:53:
#   no such host
#
# That failure is easy to misread as a DNS problem on the cluster. It is not —
# the hostname only exists inside an OpenShift cluster.
#
# Composition: it lists TWO resources. Kustomize merges them, and because both
# derive from the same base the result stays one coherent object set rather than
# two copies of each workload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-watch-lab

resources:
  # The lab overlay: replicas → 1, resources → small, PDBs/HPA deleted,
  # Routes deleted, NodePorts, storage → 2Gi. Everything about "this is a lab".
  - ../kubernetes

# Image rewrite only. Applied after the resources above, so the base image names
# are what get matched.
images:
  - name: image-registry.openshift-image-registry.svc:5000/fire-watch/worker
    newName: ghcr.io/cucumberone/fire-watch/worker
    newTag: latest
  - name: image-registry.openshift-image-registry.svc:5000/fire-watch/ws-gateway
    newName: ghcr.io/cucumberone/fire-watch/ws-gateway
    newTag: latest
  - name: image-registry.openshift-image-registry.svc:5000/fire-watch/frontend
    newName: ghcr.io/cucumberone/fire-watch/frontend
    newTag: latest
  - name: image-registry.openshift-image-registry.svc:5000/fire-watch/http-ingress
    newName: ghcr.io/cucumberone/fire-watch/http-ingress
    newTag: latest
  - name: image-registry.openshift-image-registry.svc:5000/fire-watch/sentinel-bridge
    newName: ghcr.io/cucumberone/fire-watch/sentinel-bridge
    newTag: latest

# NO imagePullSecrets — the five GHCR packages are PUBLIC.
#
# Verified the pull the way a cluster does it: GHCR answers 401 on a bare
# manifest request and returns a `www-authenticate` challenge; following that
# handshake with an ANONYMOUS token returns 200. So no credential is needed.
#
#   curl -s "https://ghcr.io/v2/.../manifests/latest"          -> 401 + challenge
#   curl -s "https://ghcr.io/token?scope=repository:...:pull"  -> anonymous token
#   curl -H "Authorization: Bearer $TOKEN" ...                 -> 200
#
# That first 401 is NOT a visibility problem — it is how every container
# registry works. Testing with a single bare curl and reading the 401 as
# "private" is the mistake to avoid here.
#
# If the packages are ever made private, add the imagePullSecrets patches back
# (one per Deployment) and create:
#
#   kubectl -n fire-watch-lab create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<user> \
#     --docker-password=<PAT with read:packages>
