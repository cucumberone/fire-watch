# The lab runs ONE Sentinel (replicas.yaml pins sts/sentinel to 1), but the base
# manifests list all three hosts because prod has three.
#
# Left uncorrected, every Sentinel-aware client walks the list: `sentinel-1` and
# `sentinel-2` have no endpoint, so each resolve attempt burns its 2 s connect
# timeout before falling through to `sentinel-0` — which is first only by luck of
# ordering, so a resolve costs seconds and the logs fill with lookup failures
# that look like a broken cluster but are only absent pods.
#
# This is NOT the same switch as stream-lab.yaml. That one disables the WAIT on
# replicas; this one removes hosts that do not exist. Both are lab-only and both
# must be reverted by moving to a non-lab overlay, never by editing the base.
#
# sentinel-bridge keeps $(POD_NAMESPACE) interpolation so the string stays
# namespace-agnostic and identical in shape to the base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-ingress
spec:
  template:
    spec:
      containers:
        - name: ingress
          env:
            - { name: SENTINELS, value: "sentinel-0.sentinel-headless:26379" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - { name: SENTINELS, value: "sentinel-0.sentinel-headless:26379" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - { name: SENTINELS, value: "sentinel-0.sentinel-headless:26379" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-bridge
spec:
  template:
    spec:
      containers:
        - name: bridge
          env:
            # Deliberately the SHORT name, like the three above it.
            #
            # It was `sentinel-0.sentinel-headless.$(POD_NAMESPACE):26379`, copied
            # from the base. That is wrong HERE for a reason specific to a patch:
            # this is a strategic merge, so the entry lands wherever it lands —
            # measured on the cluster, SENTINELS at index 1 and POD_NAMESPACE at
            # index 7. Kubernetes expands `$(VAR)` only from variables declared
            # EARLIER in the list, so the reference became an empty string and the
            # bridge dialled `sentinel-0.sentinel-headless.:26379`. The only
            # symptom was `sentinel unavailable; leaving cluster untouched` every
            # 5 s, which reads as a Sentinel outage and sent me looking at the
            # Sentinel.
            #
            # The base keeps the interpolation because prod's manifest must not
            # name a namespace. In the lab the namespace is already fixed by
            # common/kustomization.yaml, and the cluster search domains resolve the
            # short name from any pod in it — which is exactly what http-ingress,
            # worker and ws-gateway already rely on.
            - { name: SENTINELS, value: "sentinel-0.sentinel-headless:26379" }
