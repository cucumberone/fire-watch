# redis-exporter (Sentinel) + valkey-exporter (master) — two exporters, because
# NEITHER Sentinel NOR Valkey has an HTTP metrics endpoint.
#
# Both speak RESP only, so Prometheus cannot scrape them and an exporter has to
# translate. Two targets, because they answer different questions and one cannot
# be asked through the other:
#
#   redis-exporter   Sentinel mode. "Does quorum still agree on a master, and is
#                    it flapping" -> redis_sentinel_* metrics.
#   valkey-exporter  Direct mode, against the `valkey` Service that
#                    sentinel-bridge keeps pointed at the current master. "Is the
#                    master healthy, is it evicting, are its replicas connected"
#                    -> redis_* metrics from INFO.
#
# Why not one exporter: a Sentinel-mode scrape never issues INFO against the data
# node, so it has no used_memory, no evicted_keys and no connected_slaves. Rules
# built on those would have been permanently silent — the same class of defect as
# the Dragonfly metric names that did not exist (docs/monitoring.md §3).
---
# ===========================================================================
# Sentinel -> redis_sentinel_* metrics
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  # 1 replica: the data is identical from every sentinel, and a duplicate scrape
  # would double-count the quorum rules.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: docker.io/oliver006/redis_exporter:v1.66.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: metrics, containerPort: 9121 }
          env:
            # REDIS_ADDR / REDIS_PASSWORD are the EXPORTER's own variable names
            # (redis_exporter also speaks Valkey). Only the VALUES are ours: the
            # Sentinel Service and the fire-watch-valkey Secret.
            - name: REDIS_ADDR
              value: "redis://sentinel-0.sentinel-headless:26379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: fire-watch-valkey, key: password }
            # Treat the target as a Sentinel, which enables the redis_sentinel_*
            # metric family.
            - { name: REDIS_EXPORTER_IS_SENTINEL, value: "true" }
            - { name: REDIS_EXPORTER_LOG_FORMAT, value: "json" }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
---
# ===========================================================================
# Valkey master -> redis_* metrics from INFO
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-exporter
  labels:
    app.kubernetes.io/name: valkey-exporter
spec:
  # 2 replicas, no leader election, deliberately: a scrape landing on either pod
  # returns the same numbers, so this is the one place duplication is harmless.
  # Two exist so a pod eviction does not open a hole in the memory and eviction
  # graphs — which are the graphs that matter most here.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-exporter
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: valkey-exporter
              topologyKey: kubernetes.io/hostname
      containers:
        - name: exporter
          image: docker.io/oliver006/redis_exporter:v1.66.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: metrics, containerPort: 9121 }
          env:
            # The ClusterIP Service, whose Endpoints sentinel-bridge keeps pointed
            # at the CURRENT MASTER. Never a pod IP (docs/redis-sentinel.md §5).
            - name: REDIS_ADDR
              value: "redis://valkey:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: fire-watch-valkey, key: password }
            # LEFT EMPTY on purpose. A `--check-keys` list makes the exporter read
            # sample keys, which would grow its cost with the keyspace; the memory
            # and eviction numbers we need come from INFO, not from per-key reads.
            - { name: REDIS_EXPORTER_CHECK_SINGLE_KEYS, value: "" }
            - { name: REDIS_EXPORTER_LOG_FORMAT, value: "json" }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-exporter
  labels:
    app.kubernetes.io/name: valkey-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
