# DragonflyDB StatefulSet — 1 master + 2 replicas, manifests only, no operator.
# See docs/dragonfly.md. OrderedReady so replicas never attempt replication
# before dragonfly-0 exists. Roles are applied at runtime by sentinel-bridge,
# never hard-coded here: a restarted pod must not assume a master that may
# since have been demoted (docs/redis-sentinel.md §4).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dragonfly
  labels:
    app.kubernetes.io/name: dragonfly
spec:
  serviceName: dragonfly-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dragonfly
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: dragonfly
              topologyKey: kubernetes.io/hostname
      containers:
        # ---------------------------------------------------------------- server
        - name: dragonfly
          image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: client, containerPort: 6379 }
            - { name: admin, containerPort: 9222 }
          # Flags come from the ConfigMap so the lab overlay patches one value
          # instead of repeating the whole list.
          # The ConfigMap is mounted at /etc/dragonfly, so the entrypoint lives
          # there. It must be run as an explicit /bin/sh argument rather than as
          # the command itself, because the ConfigMap's defaultMode does not make
          # it executable and configMap volumes are read-only.
          command: ["/bin/sh", "/etc/dragonfly/entrypoint.sh"]
          env:
            - name: DRAGONFLY_PASSWORD
              valueFrom:
                secretKeyRef: { name: fire-watch-dragonfly, key: password }
          resources:
            requests: { cpu: 500m, memory: 8Gi }
            limits: { cpu: "4", memory: 48Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /etc/dragonfly, readOnly: true }
            - { name: data, mountPath: /data }
          # The flag file lives in the ConfigMap; the entrypoint reads it and
          # appends --requirepass before exec'ing the server.
          workingDir: /
          startupProbe:
            # A 36gb dataset replay can take a long time; 60 * 5s = 5 minutes.
            exec:
              command: ["redis-cli", "-p", "6379", "--no-auth-warning", "-a", "$(DRAGONFLY_PASSWORD)", "ping"]
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 10
          readinessProbe:
            # A replica mid-full-sync must not count as healthy, so this checks
            # the link on replicas and the ping on the master.
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  redis-cli -p 6379 --no-auth-warning -a "$DRAGONFLY_PASSWORD" ping >/dev/null || exit 1
                  role=$(redis-cli -p 6379 --no-auth-warning -a "$DRAGONFLY_PASSWORD" --raw info replication | grep '^role:' | tr -d '\r' | cut -d: -f2)
                  if [ "$role" = "slave" ]; then
                    redis-cli -p 6379 --no-auth-warning -a "$DRAGONFLY_PASSWORD" --raw info replication \
                      | grep -q 'master_link_status:up' || exit 1
                  fi
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 10
          livenessProbe:
            # Never assert ROLE here: a legitimate failover would restart the pod.
            exec:
              command: ["redis-cli", "-p", "6379", "--no-auth-warning", "-a", "$(DRAGONFLY_PASSWORD)", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6

            timeoutSeconds: 10
        # ------------------------------------------------- snapshot pruner
        - name: snapshot-pruner
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/prune/prune.sh"]
          env:
            - { name: FW_SNAPSHOT_KEEP, value: "2" }
            - { name: FW_SNAPSHOT_DIR,  value: "/data" }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: prune, mountPath: /opt/prune, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: prune-tmp, mountPath: /tmp }
          livenessProbe:
            # prune.sh touches /tmp/alive on every pass (10 min apart); a hung
            # pruner would let snapshots accumulate until the PV fills.
            exec:
              command: ["/bin/sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/alive) )) -lt 900"]
            periodSeconds: 60
            failureThreshold: 3
            timeoutSeconds: 10
      volumes:
        - name: config
          configMap:
            name: dragonfly-config
        # prune.sh lives in the same ConfigMap but must be mounted separately:
        # the server container mounts the whole ConfigMap at /etc/dragonfly and
        # a second mount of the same source is not allowed in one container, so
        # the pruner uses its own projected volume with only the script.
        - name: prune
          configMap:
            name: dragonfly-config
            items:
              - { key: prune.sh, path: prune.sh }
            defaultMode: 0755
        - name: prune-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 64Gi
