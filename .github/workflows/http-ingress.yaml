name: http-ingress image

# Builds and pushes ONLY the http-ingress image.
#
#   ghcr.io/cucumberone/fire-watch/http-ingress:<tag>
#
# TWO TRIGGERS, ONE JOB.
#
#   1. `push` to main, when anything this build can OBSERVE changed — the service,
#      its tests' inputs, or its own workflow file. The path filter is the point: a
#      docs-only commit, a change to another service or a k8s change must not
#      rebuild and publish this image, because every publish is a new `latest` and
#      a pod that may restart.
#   2. `workflow_dispatch`, for a rebuild with no code change at all — a base image
#      CVE, a dependency bump that landed elsewhere, or re-tagging a commit.
#
# The image workflow is NOT the deploy workflow. Publishing here moves a tag in
# GHCR; nothing talks to a cluster. `deploy.yaml` stays manual for exactly that
# reason (docs/images.md §9.3), so a merge can never re-apply a cluster by itself.
#
# WHAT THE PATH FILTER MUST INCLUDE. Anything the build or its TESTS read, not
# just this directory:
#
#   services/http-ingress/**             the service (COPY'd into the image)
#   .github/workflows/http-ingress.yaml  this file — a trigger edit must be testable
#   schemas/**                           COPY'd into the image AND read by its tests
#
# `schemas/` is load-bearing twice over: the image must contain it or the ingress
# refuses to start (services/http-ingress/src/schema.js), and the tests read it to
# assert the mapping still matches the published contract. A schema-only commit
# therefore has to rebuild this image.
#
# Tags:
#   `sha-<short>`             always — the commit the image was built from
#   `manual-<yyyyMMdd-HHmmss>` on a manual run — distinguishes two runs of one commit
#   `latest`                  always on push; opt-in on dispatch (see below)
#
# No `pull_request_target` exists here at all, so a PR can never reach the
# registry credential.

on:
  push:
    branches: [main]
    paths:
      - 'services/http-ingress/**'
      - '.github/workflows/http-ingress.yaml'
      - 'schemas/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment (lab or prod)
        type: choice
        required: true
        # No default. A build should not claim an environment because a form was
        # submitted without reading it.
        options:
          - lab
          - prod
      push_latest:
        description: Also tag this build `latest`
        type: boolean
        # Opt-in rather than automatic for a dispatch. "latest" is a claim that
        # this is the current good build, and a hand-started run is not
        # automatically that. A PUSH run moves `latest` without asking, because a
        # merge to main is exactly that claim — see docs/images.md §1.1.
        default: true

# Scoped per service, not per ref. A shared group would make the worker build
# cancel the frontend build — and it is NOT keyed by ref either, because a push
# run (refs/heads/main) and a dispatch run (refs/heads/main too) of the same
# service must not publish two different images at once. The newer one wins, and
# `latest` follows it; the alternative is two pushes racing and the older commit
# ending up as `latest`.
concurrency:
  group: image-http-ingress
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Hard-coded on purpose. OCI registry paths must be lowercase and the repo
  # casing is `cucumberone/fire-watch`, so `${{ github.repository }}` cannot be
  # used directly. It must also match `newName:` in k8s/overlays/ghcr — if the
  # push path and the pull path ever disagree, every pod fails ImagePullBackOff
  # while the build reports success. One literal in two places is easier to
  # keep honest than an unused variable that can silently override one of them.
  IMAGE: ghcr.io/cucumberone/fire-watch/http-ingress

jobs:
  build:
    runs-on: ubuntu-24.04
    # Binds the run to the chosen Environment, which is what makes `vars.*`
    # resolve against it instead of the repository defaults. If the environment
    # does not exist, GitHub creates it with no protection — create it first.
    # A PUSH run has no input, so it falls back to `lab`. That is deliberate and
    # it changes NOTHING about the image: the path is hard-coded and the two
    # environments publish to the same GHCR package. The binding exists only so a
    # human dispatch can target an environment's variables, and an image build
    # reads none of them.
    environment: ${{ inputs.environment || 'lab' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/http-ingress/package-lock.json

      # `npm ci`, not `npm install`: the lockfile is committed and a build must
      # not resolve a different dependency tree than the one tested.
      - name: Install
        working-directory: services/http-ingress
        run: npm ci --no-audit --no-fund

      # Tests gate the push. Publishing a broken image is worse than publishing
      # nothing.
      - name: Test
        working-directory: services/http-ingress
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # The commit, always, for both triggers.
            type=sha,prefix=sha-,format=short
            # Dispatch only: two runs of one commit need telling apart, and a
            # push run is already uniquely identified by its commit.
            type=raw,value=manual-{{date 'yyyyMMdd-HHmmss'}},enable=${{ github.event_name == 'workflow_dispatch' }}
            # `latest` moves on a PUSH to main (that is what a merge means) and
            # only on request for a dispatch. On a push the input does not exist,
            # so `inputs.push_latest` is empty and falsy — the explicit
            # event_name test is what keeps a merge from silently publishing
            # without `latest`.
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.push_latest }}
          labels: |
            org.opencontainers.image.title=fire-watch http-ingress
            org.opencontainers.image.description=fire-watch event server — HTTP to Valkey stream ingress
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root, NOT services/http-ingress: the image must contain
          # schemas/event-ingest.schema.json, which the ingress reads at runtime
          # (docs/event-schema.md). A context of services/http-ingress cannot
          # reference a sibling directory, and the resulting image starts happily
          # and then rejects every EVT_* request with ENOENT. .dockerignore at the
          # root keeps the context from ballooning.
          context: .
          file: services/http-ingress/Dockerfile
          # Always push: a manual build that did not publish would be pointless.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only: the target is x86 OpenShift. Add arm64 here when
          # there is an arm64 cluster to run it on.
          platforms: linux/amd64
          cache-from: type=gha,scope=http-ingress
          cache-to: type=gha,scope=http-ingress,mode=max
          provenance: true
          sbom: true
          pull: true

      # The image has no PR page to look at, so the tag just produced is the only
      # record of what to deploy. Put it where a human will see it.
      - name: Summary
        run: |
          {
            echo "### http-ingress image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Environment | \`${{ inputs.environment || 'lab (default on push)' }}\` |"
            echo "| Image | \`${{ env.IMAGE }}\` |"
            echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
