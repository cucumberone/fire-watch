# DragonflyDB configuration + the snapshot-pruner sidecar script.
# Flags mirror docs/dragonfly.md §4.2 exactly. Two of them are correctness
# requirements, not tuning:
#   --requirepass          -> Sentinel and clients authenticate (fault-tolerance.md §3.6)
#   --maxmemory-policy     -> noeviction, so eviction is loud, never silent (fault-tolerance.md §3.9)
apiVersion: v1
kind: ConfigMap
metadata:
  name: dragonfly-config
  labels:
    app.kubernetes.io/name: dragonfly
data:
  # Kept as a file rather than inline args so the pruner and the server read
  # from one place and a lab overlay can patch a single value.
  dragonfly.flags: |
    --logtostderr
    --dir=/data
    --dbfilename=firewatch-{timestamp}
    --df_snapshot_format=true
    --snapshot_cron=0 * * * *
    --maxmemory=36gb
    --maxmemory-policy=noeviction
    --proactor_threads=4
    --replica_delete_expired=false
    --port=6379
    --admin_port=9222

  # Reads the flag file, appends --requirepass from the environment, and execs
  # the server. Written as a script because the flags file contains a cron
  # expression with spaces, which cannot be produced by word-splitting safely.
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    : "${DRAGONFLY_PASSWORD:?DRAGONFLY_PASSWORD is required}"
    set --
    while IFS= read -r line; do
      [ -n "$line" ] || continue
      set -- "$@" "$line"
    done < /etc/dragonfly/dragonfly.flags
    exec dragonfly --requirepass="$DRAGONFLY_PASSWORD" "$@"

  # Keeps the newest $FW_SNAPSHOT_KEEP generations and never deletes the
  # current hour's set. Two generations is enough because q.audit.events
  # covers the gap (docs/dragonfly.md §6).
  prune.sh: |
    #!/bin/sh
    set -eu
    KEEP="${FW_SNAPSHOT_KEEP:-2}"
    DIR="${FW_SNAPSHOT_DIR:-/data}"
    while true; do
      touch /tmp/alive
      # A "generation" is a base name shared by the .dfs files Dragonfly
      # writes for one snapshot (sharded: base-<n>.dfs plus a summary file).
      gens=$(ls -1 "$DIR"/firewatch-*.dfs 2>/dev/null \
             | sed -E 's#^.*/(firewatch-[0-9T:+-]+).*#\1#' \
             | sort -u \
             | tail -n +1) || true
      total=$(printf '%s\n' "$gens" | grep -c . || true)
      if [ "${total:-0}" -gt "$KEEP" ]; then
        printf '%s\n' "$gens" | head -n -"$KEEP" | while read -r g; do
          [ -n "$g" ] || continue
          echo "pruning snapshot generation $g"
          rm -f "$DIR/$g"*.dfs
        done
      fi
      sleep 600
    done
