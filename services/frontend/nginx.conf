server {
    # 8080, never 80: OpenShift runs the container with an arbitrary UID and the
    # restricted SCC refuses a low port without a capability grant.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config and the shell are never cached: a deploy must take effect
    # on the next load without a hard refresh.
    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted bundles are immutable.
    location ~* \.[0-9a-f]{12}\.(js|css)$ {
        add_header Cache-Control "immutable, max-age=31536000" always;
    }
    location ~* \.css$ {
        add_header Cache-Control "immutable, max-age=31536000" always;
    }

    # SPA fallback: any unknown path is the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static probe target. Intentionally does not touch any dependency.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Security headers. connect-src must list the gateway origin or the browser
    # silently blocks the WebSocket: this is the most common cause of "the page
    # loads but nothing streams" (docs/frontend.md §7).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Writable paths for a readOnlyRootFilesystem container.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;
}
