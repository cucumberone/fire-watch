# Base — the plan of record.
#
# NOTE on namespace ownership (see docs/networking.md §5):
#   The namespace ALREADY EXISTS and is shared. This base therefore does NOT
#   create a Namespace, ResourceQuota or LimitRange object — all three would
#   affect workloads we do not own. `namespace:` below only labels the
#   resources we apply; it does not create anything.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fire-watch

labels:
  - pairs:
      app.kubernetes.io/part-of: fire-watch
    includeSelectors: false

resources:
  - 10-rabbitmq-rbac.yaml
  - 11-rabbitmq-config.yaml
  - 12-rabbitmq-user-config.yaml
  - 13-rabbitmq-services.yaml
  - 14-rabbitmq-statefulset.yaml
  - 20-valkey-config.yaml
  - 20-event-fold-config.yaml
  - 22-valkey-services.yaml
  - 23-valkey-statefulset.yaml
  - 30-sentinel-config.yaml
  - 31-sentinel-statefulset.yaml
  - 32-sentinel-bridge.yaml
  - 33-redis-exporter.yaml
  - 34-http-ingress.yaml
  - 40-workers.yaml
  - 41-ws-gateway.yaml
  - 42-frontend.yaml
  - 60-monitoring.yaml
  - 01-pdb.yaml

# Secrets are NOT in this base, so nothing secret can enter git. Create them
# once from the checked-in template:
#
#   cp .env.example .env          # then fill in real values
#   ./scripts/create-secrets.sh
#
# Required keys: fire-watch-rabbitmq{password}, fire-watch-valkey{password},
#                fire-watch-ingress{token}
#
# The RabbitMQ ACCOUNT NAME is not a Secret key. It is ConfigMap
# `fire-watch-rabbitmq-user` in 12-rabbitmq-user-config.yaml: an account name is
# not a credential, and a Secret cannot be read back to audit it. The broker
# creates its only account from that ConfigMap value, so it must agree with
# AMQP_USER everywhere else — create-secrets.sh and deploy.yaml both enforce it.
#
# Do NOT generate these with a one-liner per Secret. `openssl rand` in two
# separate commands produces two different passwords: the Valkey pods read theirs
# from the Secret, while the Sentinels bake theirs into sentinel.conf at first
# boot. Mismatched values come up as a cluster where every Sentinel reports the
# master as down and failover never works. One file, one source.
