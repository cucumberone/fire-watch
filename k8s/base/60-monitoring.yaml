# Monitoring: ServiceMonitors + PrometheusRules.
#
# Requires the OpenShift monitoring stack (or kube-prometheus-stack):
#   prometheus-operator CRDs  (ServiceMonitor, PrometheusRule)
#   kube-state-metrics        (pod labels, restart counters)
#   cAdvisor                  (container_memory_working_set_bytes)
#
# The lab overlays DELETE this file: neither CRD exists on a lab cluster, and a
# lab has no Prometheus. See overlays/lab/common/delete-monitoring.yaml.
#
# Metric names below were taken from the sources, not guessed:
#   Valkey     redis_exporter v1.66.0 (INFO field -> metric mapping)
#   RabbitMQ   rabbitmq_prometheus plugin
#   Sentinel   oliver006/redis_exporter (sentinel mode)
---
# ===========================================================================
# ServiceMonitors — tell the operator WHERE to scrape
# ===========================================================================

# RabbitMQ: metrics come from the rabbitmq_prometheus plugin on the management
# port. Already enabled in base/11-rabbitmq-config.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: management
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# Valkey master, scraped THROUGH valkey-exporter.
#
# There is no Valkey HTTP endpoint at all — everything is RESP `INFO` — so the
# ServiceMonitor points at the exporter Service, not at the StatefulSet. The
# exporter itself targets `valkey:6379`, which sentinel-bridge keeps pointed at
# the CURRENT MASTER, so every rule below describes the master.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valkey-exporter
  labels:
    app.kubernetes.io/name: valkey-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# Sentinel via redis_exporter. Sentinel speaks RESP only — there is no HTTP
# endpoint to scrape — so an exporter is required. See 33-redis-exporter.yaml.
# The VALKEY DATA metrics come from the separate valkey-exporter below: a
# Sentinel-mode scrape never issues INFO, so it has no memory or eviction numbers.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# ===========================================================================
# PrometheusRules
# ===========================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fire-watch-rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  groups:
    - name: fire-watch.rabbitmq
      rules:
        # --- a backlog that never drains means consumers are gone or stuck
        - alert: RabbitMQQueueBacklogGrowing
          # ready messages never going down over 15 min => nothing is consuming
          expr: |
            rabbitmq_quorum_queue_messages_ready > 0
            and
            delta(rabbitmq_quorum_queue_messages_ready[15m]) >= 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Quorum queue {{ $labels.queue }} is not draining"
            description: "{{ $value }} messages ready and the backlog has not fallen in 15 minutes. Consumers are stopped or the write gate is closed."

        # --- memory alarm: publishing is blocked, not slow
        - alert: RabbitMQMemoryAlarm
          expr: rabbitmq_alarms_memory_used_watermark == 1
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "RabbitMQ memory alarm on {{ $labels.node }}"
            description: "Publishers are blocked until memory drops below the high watermark."

        # --- disk alarm: same failure mode, different cause
        - alert: RabbitMQDiskAlarm
          expr: rabbitmq_alarms_free_disk_space_watermark == 1
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "RabbitMQ free-disk alarm on {{ $labels.node }}"
            description: "Publishing is blocked. Check the PV and the audit queue size."

        # --- unacked messages with no consumers: the consumer died silently
        - alert: RabbitMQUnackedWithNoConsumers
          expr: |
            rabbitmq_queue_messages_unacked > 0
            and on (queue)
            rabbitmq_queue_consumers == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Queue {{ $labels.queue }} has unacked messages and no consumers"
            description: "Messages are pinned to a consumer that is no longer connected. They will be redelivered on channel recovery, but only if the channel closes."

        # --- quorum loss: fewer than 3 members means no tolerance for another loss
        - alert: RabbitMQClusterIncomplete
          expr: count(rabbitmq_identity_info) < 3
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Only {{ $value }} of 3 RabbitMQ nodes are being scraped"
            description: "Quorum queues need 2 of 3 members. At 2 the cluster works but a second loss stops publishing."

        # --- dead-lettered events: something was rejected, never silently
        - alert: RabbitMQDeadLetteredEvents
          expr: rabbitmq_queue_messages_ready{queue="q.event.ingest.dlq"} > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} events in the dead-letter queue"
            description: "Validation failures only — requeue is unlimited by design (fault-tolerance.md §3.1). Inspect with: rabbitmqadmin get queue=q.event.ingest.dlq"

        # --- audit WAL filling up: retention or a burst will soon block ingest
        - alert: RabbitMQAuditQueueFilling
          expr: |
            (rabbitmq_quorum_queue_messages_bytes{queue="q.audit.events"} or 0)
            / 68719476736 > 0.70
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Audit WAL is {{ $value | humanizePercentage }} of its 64GiB cap"
            description: "At 100% the worker's audit publish is rejected and ingest stalls. The 7-day TTL should normally keep this near 19GiB."

---
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fire-watch-valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  groups:
    - name: fire-watch.valkey
      rules:
        # --- the master refuses writes: min-replicas-to-write is unsatisfied
        #
        # This is the ENGINE-level half of the split-brain guard, and the most
        # important alert in the set after eviction. Valkey returns
        # `NOREPLICAS Not enough good replicas to write`, the worker requeues, and
        # RabbitMQ accumulates — correctly, because refusing the write is the
        # intended behaviour when the master cannot see two replicas.
        #
        # `redis_connected_slaves` is exporter-owned and comes from INFO
        # replication. It is read from the master only, since valkey-exporter
        # targets the `valkey` Service.
        - alert: ValkeyWriteGateClosed
          expr: redis_connected_slaves < 2
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Valkey master has {{ $value }} connected replica(s), needs 2"
            description: "min-replicas-to-write 2 is refusing writes. Events are accumulating in q.event.ingest. Check pod status and INFO replication on each pod."

        # --- replication falling behind
        - alert: ValkeyReplicaLag
          expr: redis_connected_slaves > 0 and redis_master_repl_offset - on(instance) group_left redis_slave_repl_offset > 100000000
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "A Valkey replica is more than 100 MB of stream behind"
            description: "A failover now would lose that tail from the replica's view. The audit queue still holds it."

        # --- eviction: PAGE. retention is already broken.
        #
        # maxmemory-policy is noeviction, so a non-zero eviction counter means
        # either the flag was overridden or another instance is being scraped.
        # This is the single most important alert in the whole set.
        - alert: ValkeyEvictingKeys
          expr: increase(redis_evicted_keys_total[5m]) > 0
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: "Valkey is EVICTING keys — events are being lost"
            description: "maxmemory-policy is noeviction, so this should be impossible. Either the config was overridden or a different instance is scraped. Re-derive sizing.md §3.4."

        # --- reads/writes are being REJECTED because maxmemory is reached
        #
        # The correct failure mode: writes fail loudly instead of evicting. It
        # still means ingestion is stalled, so it pages too.
        - alert: ValkeyOutOfMemory
          expr: redis_commands_processed_total and on() (redis_memory_used_bytes / redis_memory_max_bytes) > 0.98
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Valkey is at the maxmemory ceiling — writes are being rejected"
            description: "noeviction means OOM errors rather than data loss. The worker requeues and RabbitMQ grows. Raise maxmemory and the pod limit together (sizing.md §3.4)."

        # --- memory approaching the pod limit: OOMKill during an AOF rewrite
        - alert: ValkeyMemoryNearLimit
          expr: |
            container_memory_working_set_bytes{container="valkey"}
            / on (pod, namespace) group_left
            kube_pod_container_resource_limits{resource="memory", container="valkey"}
            > 0.90
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Valkey {{ $labels.pod }} at {{ $value | humanizePercentage }} of its memory limit"
            description: "An AOF rewrite forks a copy-on-write image on top of the dataset. The log now rotates at 32 MB of growth, which is frequent, so above 90% an OOMKill during a rewrite is likely."

        # --- persistence failing: the restart path is broken
        #
        # redis_rdb_last_bgsave_status / redis_aof_last_write_status are exporter
        # translations of INFO persistence. A `0` here means the last write to the
        # AOF FAILED, which is a durability failure even though the process is up.
        - alert: ValkeyAofWriteFailing
          expr: redis_aof_last_write_status == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Valkey cannot write its AOF"
            description: "Durability is broken: a restart would lose everything since the last good write. Check the PV — a full or detached volume looks exactly like this."

        - alert: ValkeyAofRewriteFailing
          expr: redis_aof_last_bgrewrite_status == 0
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "Valkey's AOF rotation keeps failing"
            description: "The 32 MB rotation is not completing, so the AOF keeps growing and a restart replays an ever-larger log. Check PV space and the aof-rewriter sidecar log for the growth figure it reports."

        # --- a replica that has been disconnected from the master for 5 min
        - alert: ValkeyReplicaDown
          expr: redis_connected_slaves < 2
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Valkey master sees {{ $value }} of 2 replicas"
            description: "Below 2 the write gate is already closed (see ValkeyWriteGateClosed). This rule exists to say which side noticed first."

        # --- the write guard has emptied the Service endpoint
        #
        # The bridge sets this label; kube-state-metrics exposes it. A better
        # signal than a custom counter because it reflects the actual routing
        # state, which is what writers act on.
        - alert: ValkeyServiceEndpointEmpty
          expr: |
            kube_pod_labels{label_fire_watch_io_writable="false"} == 1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Valkey {{ $labels.pod }} is marked NOT writable"
            description: "sentinel-bridge has emptied Endpoints/valkey. Writers are blocked and events are accumulating in RabbitMQ. Check INFO replication for the missing replicas."
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fire-watch-sentinel
  labels:
    app.kubernetes.io/name: sentinel
spec:
  groups:
    - name: fire-watch.sentinel
      rules:
        # --- sentinel cannot see the master: no failover can be authorised
        #
        # redis_exporter exposes this per-master with a state label.
        # Verify the exact series name against your exporter version:
        #   kubectl -n fire-watch exec deploy/redis-exporter -- \
        #     wget -qO- localhost:9121/metrics | grep sentinel
        - alert: SentinelMasterNotOk
          expr: redis_sentinel_master_status{master_name="fire-watch-valkey"} != 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Sentinel on {{ $labels.instance }} does not consider the master ok"
            description: "If all three agree, Sentinel will promote a replica. If only one does, quorum protects you — but check why."

        # --- not enough sentinels agreeing = no quorum
        - alert: SentinelQuorumAtRisk
          expr: |
            count(redis_sentinel_master_status{master_name="fire-watch-valkey"}) < 2
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Only {{ $value }} sentinel(s) reachable, quorum needs 2"
            description: "With fewer than 2 sentinels no failover can be authorised, so a master loss becomes an outage."

        # --- repeated failovers: something is flapping
        - alert: SentinelFailoverFlapping
          expr: |
            increase(redis_sentinel_master_role_changes_total{master_name="fire-watch-valkey"}[1h]) > 2
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: "More than 2 master role changes in an hour"
            description: "Either the master is genuinely unstable or the bridge and Sentinel disagree. Check bridge logs for repeated REPLICAOF."

        # --- one master only
        - alert: SentinelMasterCountWrong
          expr: count(redis_sentinel_master_status{master_name="fire-watch-valkey"}) != 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} of 3 sentinels are reporting the master"
            description: "Missing sentinels weaken quorum. Check pod status and the sentinel PVCs (the config epoch lives on them)."

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fire-watch-workloads
  labels:
    app.kubernetes.io/name: fire-watch
spec:
  groups:
    - name: fire-watch.workloads
      rules:
        # --- a worker that cannot write must not consume; this is how you see it
        - alert: WorkersNotReady
          expr: kube_deployment_status_replicas_ready{deployment="worker"} < 1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "No worker pod is ready"
            description: "Events are accumulating in q.event.ingest and nothing is draining them."

        # --- crash loops across the board usually mean a bad config or a missing Secret
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace=~"fire-watch.*"}[15m]) * 60 * 15 > 3
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }}/{{ $labels.container }} is restarting repeatedly"
            description: "Check the previous logs. A missing Secret or a bad flag fails at boot, not at runtime."

        # --- a pod that never schedules after a node loss
        - alert: PodPending
          expr: |
            kube_pod_status_phase{namespace=~"fire-watch.*", phase="Pending"} == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} has been Pending for 15+ minutes"
            description: "Usually insufficient memory for a rescheduled Valkey. See sizing.md §3.3 — a 52Gi limit needs 128 GiB nodes to move."
