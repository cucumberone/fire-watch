# The write guard moved into sentinel-bridge: the bridge already reads every
# pod's ROLE, so counting replicas there is the same information without a
# sidecar. In the lab there is exactly one Dragonfly and no replica at all, so
# the guard must be disabled or it would withhold its own endpoint forever
# (docs/kustomize.md §3.6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-bridge
spec:
  template:
    spec:
      containers:
        - name: bridge
          env:
            - { name: FW_NAMESPACE,                     value: fire-watch-lab }
            - { name: FW_DRAGONFLY_STATEFULSET,         value: dragonfly }
            - { name: FW_WRITE_GUARD_MIN_REPLICAS,      value: "0" }
            - { name: FW_RECONCILE_INTERVAL,            value: "5s" }
            - name: DRAGONFLY_PASSWORD
              valueFrom:
                secretKeyRef: { name: fire-watch-dragonfly, key: password }
