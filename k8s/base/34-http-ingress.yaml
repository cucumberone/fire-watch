# http-ingress — HTTP from an external nginx into the Valkey ingest stream.
#
# This is a PRODUCER, not a consumer. It is separate from `worker` because the
# two have opposite failure semantics: the ingress must answer 5xx when it cannot
# append, while a worker must never answer anything at all.
#
# Exposure: NodePort, because the traffic originates outside the cluster (an
# external nginx) and OpenShift Routes speak HTTP but route to a Service — a
# Route would work too, but a NodePort keeps the external nginx's existing
# upstream pool unchanged and avoids the router's 30s timeout for large batches.
# See docs/http-ingress.md §4.
#
# The Service is a plain LoadBalancer-less NodePort on a fixed port so the
# external nginx config is a constant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-ingress
  labels:
    app.kubernetes.io/name: http-ingress
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: http-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: http-ingress
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: http-ingress
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ingress
          image: image-registry.openshift-image-registry.svc:5000/fire-watch/http-ingress:latest
          # Always, NOT IfNotPresent. The tag is `:latest`, which is mutable, so
          # IfNotPresent silently keeps running whatever image happened to be
          # cached on the node — a rebuild would never deploy. Observed here: the
          # bridge ran sha256:1b8b9436 for ten minutes while the registry held
          # 4710ad48, and nothing in the pod said so.
          #
          # Trade-off: an Always policy needs the registry on every restart. The
          # alternative is pinning an immutable tag per environment, which is the
          # right answer for production (docs/images.md §7). Always is correct
          # for a lab on a mutable tag.
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: FW_PORT,           value: "8080" }
            - { name: FW_EVENT_PATH,     value: /events }
            - { name: FW_MAX_BODY_BYTES, value: "2097152" }
            - { name: FW_MAX_BATCH,      value: "500" }
            # Bound on WAIT: how long a request waits for replica acknowledgement
            # before answering 503.
            - { name: FW_CONFIRM_TIMEOUT_MS, value: "10000" }

            # Shared secret the external nginx must send as X-Ingest-Token.
            - name: FW_INGEST_TOKEN
              valueFrom:
                secretKeyRef: { name: fire-watch-ingress, key: token }

            # ---- the ingest stream on the Valkey master (via Sentinel) ----
            - { name: SENTINELS,          value: "sentinel-0.sentinel-headless:26379,sentinel-1.sentinel-headless:26379,sentinel-2.sentinel-headless:26379" }
            - { name: VALKEY_MASTER_NAME, value: fire-watch-valkey }
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: { name: fire-watch-valkey, key: password }
            - { name: FW_STREAM_KEY,      value: "fw:stream:ingest" }
            # 202 only after this many replicas acknowledged the XADD (WAIT).
            - { name: FW_WAIT_REPLICAS,   value: "1" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 10
          readinessProbe:
            # False while Valkey is unreachable: an ingress that cannot
            # append must leave the load balancer so nginx fails over instead
            # of hammering a pod that will only answer 503.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 10
          lifecycle:
            preStop:
              # Let in-flight requests finish their XADD/WAIT and answer.
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: http-ingress
  labels:
    app.kubernetes.io/name: http-ingress
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: http-ingress
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30900
