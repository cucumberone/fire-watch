name: http-ingress image

# Builds and pushes ONLY the http-ingress image.
#
#   ghcr.io/cucumberone/fire-watch/http-ingress:<tag>
#
# Path-filtered, so an unrelated change does not rebuild it. See worker.yaml for
# the full rationale on path filters, tags and the absence of
# `pull_request_target`.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'services/http-ingress/**'
      - '.github/workflows/http-ingress.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'services/http-ingress/**'
      - '.github/workflows/http-ingress.yaml'
  workflow_dispatch:

concurrency:
  group: image-http-ingress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/cucumberone/fire-watch/http-ingress

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/http-ingress/package-lock.json

      - name: Install
        working-directory: services/http-ingress
        run: npm ci --no-audit --no-fund

      # Two of these tests are live-broker end-to-end tests that auto-skip when
      # no RabbitMQ is reachable. They skip in CI, so the unit coverage is what
      # gates the push — recorded here so the green check is not over-read.
      - name: Test
        working-directory: services/http-ingress
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=fire-watch http-ingress
            org.opencontainers.image.description=fire-watch event server — HTTP to AMQP ingress
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/http-ingress
          file: services/http-ingress/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=http-ingress
          cache-to: type=gha,scope=http-ingress,mode=max
          provenance: true
          sbom: true
          pull: true
