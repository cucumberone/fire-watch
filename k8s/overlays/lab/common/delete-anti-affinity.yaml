# Remove required pod anti-affinity. With one replica there is nothing to
# spread, and leaving `required` in place would be misleading about what the
# lab actually guarantees (docs/kustomize.md §3.2).
#
# Setting the field to [] removes the rule entirely.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: []
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dragonfly
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: []
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: []
