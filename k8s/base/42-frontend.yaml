# Frontend — static React app behind an unprivileged nginx.
# See docs/frontend.md. Probes are intentionally trivial: the app has no
# dependencies, and a dependency-aware probe would restart pods during a
# gateway outage, exactly when the UI must stay up to show the reconnect state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: frontend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          # nginx-unprivileged listens on 8080; a normal nginx image cannot bind
          # :80 as a random UID under the restricted SCC.
          image: image-registry.openshift-image-registry.svc:5000/fire-watch/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Runtime config is mounted, not baked in, so one image works in
            # every environment (docs/frontend.md §3).
            - { name: runtime-config, mountPath: /usr/share/nginx/html/config.json, subPath: config.json, readOnly: true }
            # The server block is a ConfigMap too: CSP and cache policy are
            # deployment concerns, not image concerns.
            - { name: nginx-conf,     mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf, readOnly: true }
            - { name: nginx-cache,    mountPath: /var/cache/nginx }
            - { name: nginx-run,      mountPath: /var/run }
            - { name: tmp,            mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: runtime-config
          configMap:
            name: frontend-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  labels:
    app.kubernetes.io/name: frontend
data:
  nginx.conf: |
    server {
        # 8080, never 80: OpenShift runs an arbitrary UID and the restricted SCC
        # refuses a low port without a capability grant.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Never cached: a deploy must take effect on the next load.
        location = /config.json { add_header Cache-Control "no-store" always; try_files $uri =404; }
        location = /index.html  { add_header Cache-Control "no-store" always; }

        # Fingerprinted bundles are immutable.
        location ~* \.[0-9a-f]{12}\.(js|css)$ { add_header Cache-Control "immutable, max-age=31536000" always; }

        # SPA fallback.
        location / { try_files $uri $uri/ /index.html; }

        # Static probe target, no dependency checks.
        location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

        # connect-src must allow ws/wss or the browser silently blocks the
        # WebSocket (docs/frontend.md §7).
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # Writable paths for a readOnlyRootFilesystem container.
        client_body_temp_path /var/cache/nginx/client_temp;
        proxy_temp_path       /var/cache/nginx/proxy_temp;
        fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
        uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
        scgi_temp_path        /var/cache/nginx/scgi_temp;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app.kubernetes.io/name: frontend
data:
  # wsUrl must match the ws-gateway Route host. Overlays patch this ConfigMap.
  config.json: |
    {
      "wsUrl": "wss://ws.fire-watch.example.com",
      "apiUrl": "",
      "backfillDefaultMinutes": 15,
      "resolveWsHostFromPage": false
    }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
