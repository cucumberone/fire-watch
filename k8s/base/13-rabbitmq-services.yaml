# RabbitMQ Services (docs/networking.md §1).
# The headless Service gives each pod a stable DNS name for peer discovery and
# for the long node names (rabbit@rabbitmq-0.rabbitmq-headless...).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    - name: epmd
      port: 4369
      targetPort: epmd
    - name: dist
      port: 25672
      targetPort: dist
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
