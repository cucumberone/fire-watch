# RBAC for the rabbitmq_peer_discovery_k8s plugin.
# The plugin must list pods and endpoints in this namespace to find peers.
# See docs/rabbitmq.md §2.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  labels:
    app.kubernetes.io/name: rabbitmq
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  labels:
    app.kubernetes.io/name: rabbitmq
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-peer-discovery
subjects:
  - kind: ServiceAccount
    name: rabbitmq
